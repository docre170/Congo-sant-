<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion</title>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <style>
        *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'poppins', sans-serif;
}
body{
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background: linear-gradient(120deg, #00c9a7 0%, #92fe9d 100%);

}
.container{
    position: relative;
    width: 380px;
    height: 520px;
    /*background: #1c1c1c transparent;*/
        background: #24232a;

    border-radius: 8px;
    overflow: hidden;
}
.container::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 380px;
    height: 420px;
    background: linear-gradient(0deg, transparent,
    #03fe78, #03fe78
    );
    /* background: transparent; */
    transform-origin: bottom right;
    animation: animate 7s linear infinite;
}
.container::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 380px;
    height: 420px;
    background: linear-gradient(0deg, transparent,
     #d803fe, #d803fe );
     /* background: transparent; */
    transform-origin: bottom right;
    animation: animate 7s linear infinite;
    animation-delay: 3s;
}
@keyframes animate {
    100%{
        transform: rotate(360deg);
    }
}
.form {
    position: absolute;
    inset: 3px;
    border-radius: 8px;
    background: linear-gradient(135deg, #00c9a7 0%, #008b7e 100%);
    z-index: 10;
    padding: 50px 40px;
    display: flex;
    flex-direction: column;
}
.form h2 {
    text-align: center;
    letter-spacing: 0.1em;
    color: #03fe78;
}
.inputBox{
    position: relative;
    width: 300px;
    margin-top: 35px;
}
.inputBox input{
    width: 100%;
    padding: 20px 10px 10px;
    background: transparent;
    border-color: #03fe78;
    border-top: none;
    border-right: none;
    font-size: 1em;
    outline: none;
    color: #03fe78;
}
input[type="submit"] {
    border: none;
    background: #03fe78;
    color: #fff;
    cursor: pointer;
    margin-top: 20px;
    padding: 12px 16px;
    width: 100%;
    border-radius: 6px;
    font-weight: 600;

}
input[type="submit"]:hover{
    background: #d803fe;
}
a{
    text-decoration: none;
    color: #fff;
}
a:hover{
    color: #03fe78;
}
    </style>
</head>
<body>
    <div class="container" data-aos="fade-up"
    data-aos-anchor-placement="bottom-bottom">

    <div class="container">
        <div class="container">
            <div class="form">
                <h2>S'identifier</h2>
            <form action="">
                <div class="inputBox">
                    <label for="email">Email :</label> <br>
                    <input type="email" id="email" name="email" required placeholder="Entrez votre email">
                    <!-- <input type="text" placeholder="Nom d'utilisateur"> -->
                </div>
                <div class="inputBox">
                    <label for="password">Mot de passe :</label>
                    <input type="password" id="password" name="password" required placeholder="Entrez votre mot de passe">
                    <!-- <input type="password" placeholder="mot de passe"> -->
                </div>
                <div class="inputBox">
                    <input type="submit" placeholder="Connexion">
                </div>
                
            </form>
            <br>
            <p>Vous n'avez pas de compte ? <a href="./inscription.html">S'inscrire</a></p>
            </div>
        </div>
    </div>
    </div>
</body>
</html>
